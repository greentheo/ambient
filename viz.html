<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070c">
<title>Ambient — the world</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden}
  #view{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;bottom:12px;display:flex;gap:14px;align-items:center;
    font:11px ui-monospace,monospace;color:#4a5568;letter-spacing:.06em;
    transition:opacity .4s;pointer-events:none}
  #hud.gone{opacity:0}
  #hud .dot{width:6px;height:6px;border-radius:50%;background:#3c4658}
  #hud.live .dot{background:#7fd1c1}
  #hud b{color:#6b7a90;font-weight:400}
  #keys{position:fixed;right:14px;bottom:12px;font:11px ui-monospace,monospace;
    color:#333d4d;letter-spacing:.06em;transition:opacity .4s}
  #hud.gone ~ #keys{opacity:0}

  /* Deliberately quiet until you go looking for it. */
  #btn-edit{position:fixed;top:12px;right:14px;background:transparent;border:1px solid #1d2534;
    color:#3c4658;border-radius:7px;padding:4px 11px;font:11px ui-monospace,monospace;
    letter-spacing:.08em;cursor:pointer;opacity:.35;transition:opacity .3s,color .3s}
  #btn-edit:hover{opacity:1;color:#7fd1c1;border-color:#2c3a50}
  #hud.gone ~ #btn-edit{opacity:0;pointer-events:none}

  #panel{position:fixed;top:0;right:0;width:330px;height:100%;overflow-y:auto;
    background:#0b0e13f2;border-left:1px solid #1d2534;transform:translateX(100%);
    transition:transform .28s ease;backdrop-filter:blur(8px);z-index:10}
  #panel.open{transform:none}
  #panel header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid #1d2534;position:sticky;top:0;
    background:#0b0e13f2}
  #panel h2{margin:0;font:600 11px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:#dfe6f2}
  #panel-close{background:none;border:0;color:#5b6779;font-size:20px;cursor:pointer;line-height:1}
  #panel-close:hover{color:#dfe6f2}
  #editor{padding:6px 14px 26px}
  .ed-group{margin-top:16px}
  .ed-group h3{margin:0 0 8px;font:600 9px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;
    text-transform:uppercase;color:#4a5568}
  .ed-row{display:grid;grid-template-columns:1fr 116px 40px;gap:8px;align-items:center;
    margin-bottom:5px}
  .ed-row label{font:11px ui-sans-serif,sans-serif;color:#8492aa}
  .ed-row input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:#0a0d13;border-radius:3px;outline:none}
  .ed-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:#7fd1c1;cursor:pointer}
  .ed-row input[type=number]{background:#161d2a;border:1px solid #222c3d;color:#dfe6f2;
    border-radius:6px;padding:3px 6px;font:11px ui-monospace,monospace;width:100%}
  .ed-row output{font:11px ui-monospace,monospace;color:#dfe6f2;text-align:right}
  .ed-btns{display:flex;gap:6px;margin-top:10px}
  .ed-btns button{flex:1;background:#161d2a;border:1px solid #222c3d;color:#dfe6f2;
    border-radius:7px;padding:6px;font:11px ui-sans-serif,sans-serif;cursor:pointer}
  .ed-btns button:hover{border-color:#7fd1c1;color:#7fd1c1}
  .ed-note{color:#4a5568;font:10px ui-sans-serif,sans-serif;margin:9px 0 0}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <span class="dot"></span>
  <b id="state">connecting…</b>
  <b id="clock"></b>
  <b><span id="world"></span> · seed <span id="seed"></span></b>
</div>
<div id="keys">E edit · F fullscreen · N new seed · W next world · A next arc · H hide</div>
<button id="btn-edit" title="Edit this world (E)">edit</button>
<aside id="panel">
  <header><h2>World</h2><button id="panel-close">&times;</button></header>
  <div id="editor"></div>
</aside>
<script type="module" src="js/viz/viz.js"></script>
</body>
</html>
